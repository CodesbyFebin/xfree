async function runTool(id,input,p={}){
  switch(id){
    case'json-formatter':case'json-beautifier':return{output:JSON.stringify(JSON.parse(input),null,p.indent||2)};
    case'json-minifier':return{output:JSON.stringify(JSON.parse(input))};

function runPipeline(tid,input){
  const m={
    'json-formatter':i=>JSON.stringify(JSON.parse(i),null,2),
    'json-beautifier':i=>JSON.stringify(JSON.parse(i),null,2),
    'json-minifier':i=>JSON.stringify(JSON.parse(i)),
    'json-sort-keys':i=>{const sk=o=>Array.isArray(o)?o.map(sk):o&&typeof o==='object'?Object.keys(o).sort().reduce((a,k)=>{a[k]=sk(o[k]);return a},{}):o;return JSON.stringify(sk(JSON.parse(i)),null,2)},
    'json-validator':i=>{JSON.parse(i);return i},
    'remove-duplicate-lines':i=>{const s=new Set();return i.split('\n').filter(l=>{const k=l.trim().toLowerCase();if(s.has(k))return false;s.add(k);return true}).join('\n')},
    'sort-lines':i=>i.split('\n').sort().join('\n'),
    'trim-whitespace':i=>i.split('\n').map(l=>l.trim()).filter(l=>l).join('\n'),
    'reverse-lines':i=>i.split('\n').reverse().join('\n'),
    'url-extractor':i=>[...new Set(i.match(/https?:\/\/[^\s<>"')\]]+/g)||[])].join('\n'),
    'base64-encode':i=>btoa(unescape(encodeURIComponent(i))),
    'url-encode':i=>encodeURIComponent(i),
    'slug-generator':i=>i.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/[\s-]+/g,'-').replace(/^-|-$/g,''),
    'csv-to-json':i=>{const ls=i.trim().split('\n');const h=ls[0].split(',');return JSON.stringify(ls.slice(1).map(l=>{const v=l.split(',');const o={};h.forEach((k,j)=>o[k.trim()]=(v[j]||'').trim());return o}),null,2)},
    'json-to-csv':i=>{const a=JSON.parse(i);const h=[...new Set(a.flatMap(Object.keys))];return[h.join(','),...a.map(o=>h.map(k=>o[k]||'').join(','))].join('\n')},
  };
  if(m[tid])return m[tid](input);
  return input;
}

function useReveal(){
  const ref=useRef(null);
  const[visible,setVisible]=useState(false);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVisible(true);obs.unobserve(el)}},{threshold:.1,rootMargin:'0px 0px -50px 0px'});
    obs.observe(el);return()=>obs.disconnect();
  },[]);
  return[ref,visible];
}
function Reveal({children,delay=0,className=''}){
  const[ref,visible]=useReveal();
  return<div ref={ref} className={`reveal ${visible?'visible':''} ${className}`} style={{transitionDelay:`${delay}ms`}}>{children}</div>
}
function StatCounter({target,suffix=''}){
  const[ref,visible]=useReveal();
  const[count,setCount]=useState(0);
  useEffect(()=>{
    if(!visible)return;let cur=0;const inc=target/40;
    const t=setInterval(()=>{cur+=inc;if(cur>=target){setCount(target);clearInterval(t)}else setCount(Math.floor(cur))},30);
    return()=>clearInterval(t);
  },[visible,target]);
  return<div ref={ref} className={`reveal ${visible?'visible':''}`}><div className="stat-value text-3xl font-bold text-white">{count}{suffix}</div></div>
}
function CodeBlock({filename,children}){

}

function CmdPalette({open,onClose}){
  const[q,setQ]=useState('');
  const ref=useRef(null);
  useEffect(()=>{if(open){setTimeout(()=>ref.current?.focus(),50);setQ('')}},[open]);
  useEffect(()=>{const h=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();if(open)onClose()}if(e.key==='Escape')onClose()};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[open,onClose]);
  const res=useMemo(()=>{if(!q.trim())return{t:TOOLS.slice(0,8),g:GUIDES.slice(0,4),w:WORKFLOWS.slice(0,3)};const s=q.toLowerCase();return{t:TOOLS.filter(t=>t.name.toLowerCase().includes(s)||t.short.toLowerCase().includes(s)||t.kw.includes(s)).slice(0,8),g:GUIDES.filter(g=>g.title.toLowerCase().includes(s)||g.desc.toLowerCase().includes(s)).slice(0,4),w:WORKFLOWS.filter(w=>w.name.toLowerCase().includes(s)).slice(0,3)}},[q]);
  if(!open)return null;
  return<div className="fixed inset-0 z-[100]" role="dialog" aria-modal="true">
    <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose}/>
    <div className="relative max-w-xl mx-auto mt-16 md:mt-24 bg-[#0f172a] border border-gray-700 rounded-2xl shadow-2xl overflow-hidden mx-4">
      <div className="flex items-center px-4 border-b border-gray-700/50">
        <Icon.Search className="w-5 h-5 text-gray-500 shrink-0"/>
        <input ref={ref} value={q} onChange={e=>setQ(e.target.value)} type="text" className="flex-1 bg-transparent px-3 py-4 text-white placeholder-gray-500 outline-none text-sm" placeholder="Search tools, guides, workflows..." autoComplete="off"/>
        <kbd className="text-[10px] text-gray-500 bg-gray-800 px-2 py-1 rounded border border-gray-700">ESC</kbd>
      </div>
      <div className="max-h-[60vh] overflow-y-auto p-2">
        {res.t.length>0&&<div className="mb-2"><div className="text-[10px] uppercase tracking-wider text-gray-500 font-medium px-3 py-2">Tools</div>{res.t.map(t=><a key={t.id} href={`#/tools/${t.slug}`} onClick={e=>{e.preventDefault();nav(`/tools/${t.slug}`);onClose()}} className="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-800 transition-colors cursor-pointer"><span className="text-green-400 text-sm">⚡</span><div><div className="text-sm text-white">{t.name}</div><div className="text-xs text-gray-500">{t.short}</div></div></a>)}</div>}
        {res.g.length>0&&<div className="mb-2"><div className="text-[10px] uppercase tracking-wider text-gray-500 font-medium px-3 py-2">Guides</div>{res.g.map(g=><a key={g.id} href={`#/guides/${g.slug}`} onClick={e=>{e.preventDefault();nav(`/guides/${g.slug}`);onClose()}} className="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-800 transition-colors cursor-pointer"><span className="text-sky-400 text-sm">📖</span><div><div className="text-sm text-white">{g.title}</div><div className="text-xs text-gray-500">{g.desc}</div></div></a>)}</div>}
        {res.w.length>0&&<div><div className="text-[10px] uppercase tracking-wider text-gray-500 font-medium px-3 py-2">Workflows</div>{res.w.map(w=><a key={w.id} href="#/studio" onClick={e=>{e.preventDefault();nav('/studio');onClose()}} className="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-800 transition-colors cursor-pointer"><span className="text-purple-400 text-sm">🔗</span><div><div className="text-sm text-white">{w.name}</div><div className="text-xs text-gray-500">{w.desc}</div></div></a>)}</div>}
        {res.t.length===0&&res.g.length===0&&res.w.length===0&&<div className="px-4 py-8 text-center text-gray-500 text-sm">No results found</div>}
      </div>
    </div>
  </div>
}

function ToolPage({slug}){
  const tool=TOOLS.find(t=>t.slug===slug);
  const[input,setInput]=useState('');
  const[output,setOutput]=useState('');
  const[error,setError]=useState('');
  const[result,setResult]=useState(null);
  const[stats,setStats]=useState(null);
  const[toast,setToast]=useState('');
  const[params,setParams]=useState({});

  if(!tool)return<NotFound/>;
  const cat=CATS.find(c=>c.id===tool.cat);
  const relTools=TOOLS.filter(t=>tool.rel?.includes(t.id));
  const relGuides=GUIDES.filter(g=>tool.gds?.includes(g.id));

  const exec=async(ep={})=>{setError('');setResult(null);setStats(null);setOutput('');try{const r=await runTool(tool.id,input,{...params,...ep});if(r.output!==undefined)setOutput(String(r.output));if(r.ok!==undefined||r.msg)setResult(r);if(r.stats)setStats(r.stats);if(r.matches)setResult(r);if(r.hashes)setResult(r);if(r.results)setResult(r);if(r.errs)setResult(r)}catch(e){setError(e.message)}};
  const copy=()=>{navigator.clipboard.writeText(output).then(()=>setToast('Copied'))};
  const dl=(fn)=>{const b=new Blob([output],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn||'output.txt';a.click()};
  const clear=()=>{setInput('');setOutput('');setError('');setResult(null);setStats(null)};

  const examples={'json-formatter':'{"name":"John","age":30,"address":{"city":"New York"}}','json-validator':'{"valid": true, "count": 42}','json-to-csv':'[{"name":"Alice","age":30},{"name":"Bob","age":25}]','csv-to-json':'name,age\nAlice,30\nBob,25','json-depth':'{"a":{"b":{"c":"deep"}},"arr":[1,2]}','remove-duplicate-lines':'apple\nbanana\napple\ncherry','sort-lines':'cherry\napple\nbanana','xml-sitemap-generator':'https://example.com/\nhttps://example.com/about','url-extractor':'<a href="https://example.com">Link</a>','word-counter':'The quick brown fox jumps over the lazy dog.','base64-encode':'Hello, World!','regex-tester':'The rain in Spain falls mainly on the plain.','email-validator':'user@example.com\ninvalid\ntest@test.org','url-validator':'https://example.com\nnot-a-url'};
  const hasEx=!!examples[tool.id];
  const loadEx=()=>setInput(examples[tool.id]||'');

  const TA=(ph,extra)=><textarea value={input} onChange={e=>{setInput(e.target.value);extra&&extra(e)}} className="w-full bg-[#020617] border border-gray-700 rounded-xl p-4 text-gray-200 min-h-[200px] focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none mono text-sm leading-relaxed resize-y" placeholder={ph}/>;

  const btns=()=>(<div className="flex flex-wrap gap-2 mt-4">
    <button onClick={()=>exec()} className="px-5 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg text-sm font-medium transition-colors">{tool.id.includes('valid')?'Validate':tool.id.includes('convert')?'Convert':tool.id.includes('extract')?'Extract':tool.id.includes('generate')?'Generate':tool.id.includes('sort')?'Sort':tool.id.includes('minif')?'Minify':tool.id.includes('format')||tool.id.includes('beautif')?'Format':'Process'}</button>
    {hasEx&&<button onClick={loadEx} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm transition-colors">Example</button>}
    {output&&<button onClick={copy} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm transition-colors">Copy</button>}
    {output&&<button onClick={()=>dl()} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm transition-colors">Download</button>}
    <button onClick={clear} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm transition-colors">Clear</button>
  </div>);

  const renderUI=()=>{
    const isEncoder=['base64-encode','url-encode','html-entity-encode','hex-text-converter'].includes(tool.id);
    const isSimple=['json-formatter','json-beautifier','json-minifier','json-sort-keys','json-to-csv','csv-to-json','json-depth','json-key-extractor','remove-duplicate-lines','sort-lines','reverse-lines','trim-whitespace','xml-sitemap-generator','url-extractor','json-escape','json-unescape'].includes(tool.id);

      case'json-schema-validator':return(<div><label className="block text-sm font-medium text-gray-300 mb-2">JSON Data</label>{TA('{"name":"John","age":30}')}<label className="block text-sm font-medium text-gray-300 mt-4 mb-2">JSON Schema</label><textarea onChange={e=>setParams({...params,schema:e.target.value})} className="w-full bg-[#020617] border border-gray-700 rounded-xl p-4 text-gray-200 min-h-[150px] mono text-sm" placeholder='{"type":"object","properties":{"name":{"type":"string"}}}'/>{btns()}{result&&<div className={`mt-4 p-4 rounded-xl text-sm ${result.ok?'bg-emerald-900/30 border border-emerald-800 text-emerald-300':'bg-red-900/30 border border-red-800 text-red-300'}`}>{result.ok?'✓ Valid against schema':`✗ ${result.errs.length} error(s):`}{result.errs&&<div className="mt-2 space-y-1">{result.errs.map((e,i)=><div key={i} className="text-red-400">• {e}</div>)}</div>}</div>}</div>);
      case'word-counter':case'line-counter':return(<div><label className="block text-sm font-medium text-gray-300 mb-2">Input Text</label><textarea value={input} onChange={e=>setInput(e.target.value)} onInput={()=>exec()} className="w-full bg-[#020617] border border-gray-700 rounded-xl p-4 text-gray-200 min-h-[200px] focus:border-green-500 outline-none text-sm leading-relaxed resize-y" placeholder="Paste or type text..."/>{stats&&<div className="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-3">{Object.entries(stats).map(([k,v])=><div key={k} className="bg-gray-800 rounded-xl p-4 text-center"><div className="text-2xl font-bold text-white">{v}</div><div className="text-xs text-gray-500 capitalize mt-1">{k.replace(/([A-Z])/g,' $1').trim()}</div></div>)}</div>}</div>);

function SchemaGen(){

function TimestampConv(){
  const[now,setNow]=useState(Math.floor(Date.now()/1000));
  const[ts,setTs]=useState(now);
  const[ds,setDs]=useState('');
  useEffect(()=>{const d=new Date(ts>1e12?ts:ts*1000);setDs(d.toISOString().slice(0,16));const iv=setInterval(()=>setNow(Math.floor(Date.now()/1000)),1000);return()=>clearInterval(iv)},[]);
  return<div><div className="grid sm:grid-cols-2 gap-6"><div><label className="block text-sm font-medium text-gray-300 mb-1">Unix Timestamp</label><input type="text" value={ts} onChange={e=>setTs(parseInt(e.target.value)||0)} className="w-full bg-[#020617] border border-gray-700 rounded-xl px-4 py-2.5 text-white mono text-sm outline-none focus:border-green-500"/><div className="mt-2 text-sm text-gray-400">{new Date(ts>1e12?ts:ts*1000).toLocaleString()}</div></div><div><label className="block text-sm font-medium text-gray-300 mb-1">Date/Time</label><input type="datetime-local" value={ds} onChange={e=>{setDs(e.target.value);setTs(Math.floor(new Date(e.target.value).getTime()/1000))}} className="w-full bg-[#020617] border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm outline-none focus:border-green-500"/><div className="mt-2 text-sm text-gray-400 mono">{ts}</div></div></div><div className="mt-4 p-3 bg-gray-800 rounded-xl"><div className="text-xs text-gray-400">Current timestamp: <span className="text-green-400 mono">{now}</span></div></div></div>
}

        </div>
        <div className="bg-[#0f172a] border border-gray-700/50 rounded-2xl p-6"><h2 className="text-lg font-semibold text-white mb-3">Input</h2><textarea value={input} onChange={e=>setInput(e.target.value)} className="w-full bg-[#020617] border border-gray-700 rounded-xl p-4 text-gray-200 min-h-[150px] mono text-sm focus:border-green-500 outline-none resize-y" placeholder="Enter your data here..."/></div>
        <div className="bg-[#0f172a] border border-gray-700/50 rounded-2xl p-6"><h2 className="text-lg font-semibold text-white mb-3">Output</h2><textarea readOnly value={output} className="w-full bg-[#020617] border border-gray-700 rounded-xl p-4 text-gray-200 min-h-[200px] mono text-sm" placeholder="Workflow output will appear here..."/><div className="flex gap-2 mt-3">{output&&<button onClick={()=>{navigator.clipboard.writeText(output);setToast('Copied')}} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm">Copy</button>}{output&&<button onClick={()=>{const b=new Blob([output],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='studio-output.txt';a.click()}} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm">Download</button>}</div></div>
      </div>
      <div className="space-y-4">
        <div className="bg-[#0f172a] border border-gray-800 rounded-xl p-5"><h3 className="font-semibold text-white text-sm mb-3">Quick Recipes</h3><div className="space-y-2">{WORKFLOWS.map(w=><button key={w.id} onClick={()=>loadRecipe(w)} className="w-full text-left p-3 bg-gray-800 hover:bg-gray-700 rounded-xl transition-colors"><div className="text-sm font-medium text-white">{w.name}</div><div className="text-xs text-gray-500 mt-0.5">{w.desc}</div></button>)}</div></div>
        <div className="bg-[#0f172a] border border-gray-800 rounded-xl p-5"><h3 className="font-semibold text-white text-sm mb-3">Processing</h3><div className="flex items-center gap-2"><Badge mode="LOCAL"/><span className="text-xs text-gray-400">All steps run in browser</span></div></div>
      </div>
    </div>
  </div>
}

/* ═══════════════════════════════════════════════════════
   PAGES
   ═══════════════════════════════════════════════════════ */

function AllTools(){
  const g={};TOOLS.forEach(t=>{const c=CATS.find(c=>c.id===t.cat);const n=c?c.name:t.cat;if(!g[n])g[n]=[];g[n].push(t)});
  return<div className="max-w-7xl mx-auto px-4 py-8 fade-in"><Crumbs items={[{l:'Home',h:'/'},{l:'All Tools',h:'/tools'}]}/><h1 className="text-3xl font-bold text-white mb-2">All Tools</h1><p className="text-gray-400 mb-8">{COUNT} free browser-based developer and SEO tools.</p>{Object.entries(g).map(([cat,tools])=><div key={cat} className="mb-10"><h2 className="text-lg font-semibold text-white mb-4">{cat} <span className="text-sm text-gray-500 font-normal">({tools.length})</span></h2><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">{tools.map(t=><TCard key={t.id} tool={t}/>)}</div></div>)}</div>
}

function CatPage({id}){
  const cat=CATS.find(c=>c.id===id);if(!cat)return<NotFound/>;
  const tools=TOOLS.filter(t=>t.cat===id);
  const guides=GUIDES.filter(g=>{if(id==='developer-tools')return g.cat==='json';if(id==='seo-tools')return g.cat==='seo';return false});
  return<div className="max-w-7xl mx-auto px-4 py-8 fade-in"><Crumbs items={[{l:'Home',h:'/'},{l:'Tools',h:'/tools'},{l:cat.name,h:`/${id}`}]}/><h1 className="text-3xl font-bold text-white mb-2">{cat.icon} {cat.name}</h1><p className="text-gray-400 mb-8">{cat.desc}</p><h2 className="text-lg font-semibold text-white mb-4">Tools <span className="text-sm text-gray-500 font-normal">({tools.length})</span></h2><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 mb-10">{tools.map(t=><TCard key={t.id} tool={t}/>)}</div>{guides.length>0&&<><h2 className="text-lg font-semibold text-white mb-4">Related Guides</h2><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{guides.map(g=><a key={g.id} href={`#/guides/${g.slug}`} onClick={e=>{e.preventDefault();nav(`/guides/${g.slug}`)}} className="group bg-[#0f172a] border border-gray-800 hover:border-green-500/40 rounded-xl p-5 block transition-all hover:-translate-y-0.5"><h3 className="font-semibold text-white text-sm mb-1 group-hover:text-green-400 transition-colors">{g.title}</h3><p className="text-xs text-gray-500">{g.desc}</p></a>)}</div></>}</div>
}

function GuidesPage(){
  return<div className="max-w-7xl mx-auto px-4 py-8 fade-in"><Crumbs items={[{l:'Home',h:'/'},{l:'Guides',h:'/guides'}]}/><h1 className="text-3xl font-bold text-white mb-2">Guides</h1><p className="text-gray-400 mb-8">Practical tutorials connected to working XFree tools.</p><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{GUIDES.map(g=><a key={g.id} href={`#/guides/${g.slug}`} onClick={e=>{e.preventDefault();nav(`/guides/${g.slug}`)}} className="group bg-[#0f172a] border border-gray-800 hover:border-green-500/40 rounded-xl p-5 block transition-all hover:-translate-y-0.5"><span className="text-[10px] text-green-400 font-semibold uppercase tracking-wider">{g.cat}</span><h2 className="font-semibold text-white mt-1.5 mb-1.5 group-hover:text-green-400 transition-colors">{g.title}</h2><p className="text-sm text-gray-500">{g.desc}</p></a>)}</div></div>
}

function GuidePage({slug}){
  const g=GUIDES.find(g=>g.slug===slug);if(!g)return<NotFound/>;
  const tool=TOOLS.find(t=>t.id===g.tool);
  return<div className="max-w-3xl mx-auto px-4 py-8 fade-in"><Crumbs items={[{l:'Home',h:'/'},{l:'Guides',h:'/guides'},{l:g.title,h:`/guides/${g.slug}`}]}/><span className="text-[10px] text-green-400 font-semibold uppercase tracking-wider">{g.cat}</span><h1 className="text-3xl font-bold text-white mt-2 mb-4">{g.title}</h1><p className="text-gray-400 mb-8 leading-relaxed">{g.desc}</p><div className="space-y-8"><section><h2 className="text-xl font-semibold text-white mb-3">What You'll Learn</h2><p className="text-gray-400 leading-relaxed">This guide walks you through using the <a href={`#/tools/${tool?.slug}`} onClick={e=>{e.preventDefault();nav(`/tools/${tool?.slug}`)}} className="text-green-400 hover:text-green-300 underline underline-offset-2">{tool?.name||'tool'}</a> to accomplish common tasks.</p></section><section><h2 className="text-xl font-semibold text-white mb-3">Get Started</h2><div className="bg-[#0f172a] border border-gray-700/50 rounded-xl p-6"><p className="text-gray-400 mb-4">Open the tool and enter your data:</p><a href={`#/tools/${tool?.slug}`} onClick={e=>{e.preventDefault();nav(`/tools/${tool?.slug}`)}} className="inline-flex items-center gap-2 px-5 py-2.5 bg-green-600 hover:bg-green-500 text-white rounded-xl text-sm font-medium transition-colors">Open {tool?.name||'Tool'} →</a></div></section><section><h2 className="text-xl font-semibold text-white mb-3">Common Use Cases</h2><ul className="space-y-2 text-gray-400"><li className="flex items-start gap-2"><span className="text-green-400 mt-0.5">•</span>Quick validation and formatting during development</li><li className="flex items-start gap-2"><span className="text-green-400 mt-0.5">•</span>Data transformation for API testing</li><li className="flex items-start gap-2"><span className="text-green-400 mt-0.5">•</span>Batch processing of configuration files</li></ul></section><section className="bg-[#0f172a] border border-gray-800 rounded-xl p-5"><h3 className="font-semibold text-white text-sm mb-2">Privacy</h3><p className="text-sm text-gray-400">This tool processes all data locally in your browser.</p><div className="mt-2"><Badge mode="LOCAL"/></div></section></div></div>
}

function WorkflowsPage(){
  return<div className="max-w-7xl mx-auto px-4 py-8 fade-in"><Crumbs items={[{l:'Home',h:'/'},{l:'Workflows',h:'/workflows'}]}/><h1 className="text-3xl font-bold text-white mb-2">Workflow Recipes</h1><p className="text-gray-400 mb-8">Pre-built multi-step pipelines for common data processing tasks.</p><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{WORKFLOWS.map(w=><div key={w.id} className="bg-[#0f172a] border border-gray-800 rounded-xl p-5 hover:border-green-500/40 transition-all"><h2 className="font-semibold text-white mb-2">{w.name}</h2><p className="text-sm text-gray-500 mb-4">{w.desc}</p><div className="flex flex-wrap items-center gap-1">{w.steps.map((s,i)=>{const t=TOOLS.find(tl=>tl.id===s);return<React.Fragment key={s}>{i>0&&<span className="text-gray-600 text-xs mx-0.5">→</span>}<span className="text-xs bg-gray-800 text-gray-300 px-2 py-0.5 rounded-lg border border-gray-700/50">{t?.name||s}</span></React.Fragment>})}</div><a href="#/studio" onClick={e=>{e.preventDefault();nav('/studio')}} className="mt-4 inline-flex text-xs text-green-400 hover:text-green-300 transition-colors">Open in Studio →</a></div>)}</div></div>
}

function DocsPage(){
  return<div className="max-w-3xl mx-auto px-4 py-8 fade-in"><Crumbs items={[{l:'Home',h:'/'},{l:'Documentation',h:'/docs'}]}/><h1 className="text-3xl font-bold text-white mb-6">Documentation</h1><div className="space-y-4">{[{t:'What is XFree?',d:`XFree is a collection of ${COUNT} free, browser-based developer and SEO tools. All processing runs locally in your browser using Local Mode.`},{t:'Local Mode',d:'Local Mode means all data processing happens in your browser using JavaScript and Web Workers. Your input is never sent to any server.'},{t:'XFree Studio',d:'Studio lets you chain multiple tools into automated workflows. Build multi-step data processing pipelines entirely in your browser.'},{t:'Publication Policy',d:'Only verified, working tools are published. XFree distinguishes between live tools and planned concepts.'},{t:'Privacy',d:'XFree processes your data locally. No analytics tracking of input data. No third-party data sharing.'}].map((s,i)=>(<div key={i} className="bg-[#0f172a] border border-gray-800 rounded-xl p-6"><h2 className="text-lg font-semibold text-white mb-2">{s.t}</h2><p className="text-gray-400 text-sm leading-relaxed">{s.d}</p></div>))}</div></div>
}

function StaticPage({title,sections}){
  return<div className="max-w-3xl mx-auto px-4 py-8 fade-in"><Crumbs items={[{l:'Home',h:'/'},{l:title,h:`/${title.toLowerCase().replace(/\s+/g,'-')}`}]}/><h1 className="text-3xl font-bold text-white mb-6">{title}</h1><div className="space-y-4">{sections.map((s,i)=>(<div key={i} className="bg-[#0f172a] border border-gray-800 rounded-xl p-6"><h2 className="text-lg font-semibold text-white mb-2">{s.t}</h2><p className="text-gray-400 text-sm leading-relaxed">{s.d}</p></div>))}</div></div>
}

function NotFound(){
  return<div className="max-w-3xl mx-auto px-4 py-20 text-center fade-in"><div className="text-6xl mb-4">🔍</div><h1 className="text-3xl font-bold text-white mb-3">Page Not Found</h1><p className="text-gray-400 mb-8">The page you're looking for doesn't exist or has been moved.</p><a href="#/" onClick={e=>{e.preventDefault();nav('/')}} className="inline-flex items-center gap-2 px-5 py-2.5 bg-green-600 hover:bg-green-500 text-white rounded-xl text-sm font-medium transition-colors">Go Home →</a></div>
}

/* ═══════════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════════ */

function App(){
  const route=useRoute();
  const[cmdOpen,setCmdOpen]=useState(false);

  useEffect(()=>{window.scrollTo(0,0)},[route]);

  useEffect(()=>{
    const handler=e=>{
      const href=e.target.closest('a')?.getAttribute('href');
      if(href&&href.startsWith('#')&&href.length>1&&!href.startsWith('#/')){
        const target=document.querySelector(href);
        if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'})}
      }
    };
    document.addEventListener('click',handler);
    return()=>document.removeEventListener('click',handler);
  },[]);

  let page;
  if(route==='/'||route==='')page=<Home onSearch={()=>setCmdOpen(true)}/>;
  else if(route==='/tools')page=<AllTools/>;
  else if(route==='/studio')page=<Studio/>;
  else if(route==='/guides')page=<GuidesPage/>;
  else if(route==='/workflows')page=<WorkflowsPage/>;
  else if(route==='/docs')page=<DocsPage/>;
  else if(route==='/about')page=<StaticPage title="About XFree" sections={[{t:'Our Mission',d:'XFree provides free, browser-based developer and SEO tools that run entirely in your browser. No signup, no data collection, no friction.'},{t:'Local First',d:'All processing happens locally. Your data never leaves your device unless you explicitly choose a cloud-enabled feature.'},{t:'Open & Transparent',d:'We believe in transparency. Every tool clearly shows its processing mode, and we never count planned features as live tools.'}]}/>;
  else if(route==='/privacy')page=<StaticPage title="Privacy Policy" sections={[{t:'Local Processing',d:'All tools process data locally in your browser. Your input is never sent to our servers.'},{t:'No Data Collection',d:'We do not collect, store, or transmit your working data. What you type stays in your browser.'},{t:'Cookies',d:'This file sets no cookies of its own.'}]}/>;
  else if(route==='/terms')page=<StaticPage title="Terms of Service" sections={[{t:'Free to Use',d:'All XFree tools are free to use for personal and commercial purposes.'},{t:'No Warranty',d:'Tools are provided as-is. We strive for accuracy but make no guarantees.'},{t:'Acceptable Use',d:'Do not use XFree tools for illegal activities or to harm others.'}]}/>;
  else if(route==='/use-cases')page=<StaticPage title="Use Cases" sections={[{t:'Developer Workflows',d:'Format JSON, validate schemas, encode/decode data, and test regex patterns — all locally.'},{t:'Technical SEO',d:'Generate sitemaps, test robots.txt, preview meta tags, and create schema markup.'},{t:'Data Processing',d:'Convert between formats, deduplicate lists, sort data, and clean text files.'},{t:'Content Creation',d:'Generate UUIDs, passwords, lorem ipsum, and URL slugs for your projects.'}]}/>;
  else if(route.startsWith('/tools/'))page=<ToolPage slug={route.replace('/tools/','')}/>;
  else if(route.startsWith('/guides/'))page=<GuidePage slug={route.replace('/guides/','')}/>;
  else{
    const cat=CATS.find(c=>c.id===route.replace('/',''));
    if(cat)page=<CatPage id={cat.id}/>;
    else page=<NotFound/>;
  }

  return<>
    <Nav onSearch={()=>setCmdOpen(true)} route={route}/>
    <main className="flex-1">{page}</main>
    <Footer/>
    <CmdPalette open={cmdOpen} onClose={()=>setCmdOpen(false)}/>
  </>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
