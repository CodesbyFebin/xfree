   §1 — AUTH CONTEXT (Simulated with localStorage)
   ═══════════════════════════════════════════════════════════════════ */
const AuthContext = createContext();

function AuthProvider({ children }) {
  const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('xfree_user')) || null);
  const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem('xfree_favorites')) || []);
  const [activity, setActivity] = useState(() => JSON.parse(localStorage.getItem('xfree_activity')) || []);

  const addActivity = (action) => {
    const newActivity = [{ action, timestamp: new Date().toISOString() }, ...activity].slice(0, 20);
    setActivity(newActivity);
    localStorage.setItem('xfree_activity', JSON.stringify(newActivity));
  };

  const login = (email) => {
    const newUser = { email, name: email.split('@')[0] };
    setUser(newUser);
    localStorage.setItem('xfree_user', JSON.stringify(newUser));
    addActivity(`Logged in as ${newUser.name}`);
  };

  const logout = () => {
    addActivity(`Logged out`);
    setUser(null);
    localStorage.removeItem('xfree_user');
  };

  const toggleFavorite = (toolId) => {
    if (!user) return;
    const isFav = favorites.includes(toolId);
    const newFavs = isFav ? favorites.filter(id => id !== toolId) : [...favorites, toolId];
    setFavorites(newFavs);
    localStorage.setItem('xfree_favorites', JSON.stringify(newFavs));
    addActivity(isFav ? `Removed tool from favorites` : `Added tool to favorites`);
  };

  return (
    <AuthContext.Provider value={{ user, login, logout, favorites, toggleFavorite, activity, addActivity }}>
      {children}
    </AuthContext.Provider>
  );
}

  return (
    <>
      <header className="sticky top-0 z-50 border-b border-dk-border bg-dk-bg/95 backdrop-blur-xl">
        <div className="mx-auto flex h-16 max-w-7xl items-center gap-4 px-4 sm:px-6 lg:px-8">
          <a href="/" className="flex shrink-0 items-center gap-2.5" aria-label="XFree homepage">
            <span aria-hidden="true" className="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 text-sm font-bold text-white shadow-lg shadow-indigo-500/20">X</span>
            <span className="text-lg font-bold tracking-tight text-white hidden sm:block">XFree<span className="text-indigo-400">.in</span></span>
          </a>

          {/* Prominent Search Bar */}
          <div className="hidden md:flex flex-1 max-w-lg mx-4 relative">
            <button 
              onClick={() => setSearchOpen(true)}
              className="w-full flex items-center gap-3 px-4 py-2 rounded-lg border border-dk-border bg-dk-surface text-sm text-dk-muted hover:border-indigo-500/50 hover:bg-dk-hover transition-all text-left"
            >
              <svg className="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <span>Search tools, pillars, or topics...</span>
              <kbd className="ml-auto rounded border border-dk-border bg-dk-bg px-1.5 py-0.5 text-[10px] text-dk-dim">⌘K</kbd>
            </button>
          </div>

          <div className="ml-auto flex items-center gap-3">
            {user ? (
              <button 
                onClick={() => setProfileOpen(true)}
                className="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-dk-border bg-dk-surface hover:bg-dk-hover transition-colors"
              >
                <div className="w-6 h-6 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-xs font-bold text-white">
                  {user.name.charAt(0).toUpperCase()}
                </div>
                <span className="text-sm font-medium text-dk-text hidden sm:block">{user.name}</span>
              </button>
            ) : (
              <button 
                onClick={() => setAuthModalOpen(true)}
                className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white transition-colors shadow-lg shadow-indigo-500/20"
              >
                Log In
              </button>
            )}
          </div>
        </div>
      </header>

      {/* Search Modal (Simplified for demo) */}
      {searchOpen && (
        <div role="dialog" className="fixed inset-0 z-[100] bg-black/70 p-4 backdrop-blur-sm fade-in" onClick={() => setSearchOpen(false)}>
          <div className="mx-auto mt-[10vh] max-w-xl bg-dk-card border border-dk-border rounded-2xl shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-3 border-b border-dk-border p-4">
              <svg className="h-5 w-5 text-dk-dim" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input autoFocus value={query} onChange={e => setQuery(e.target.value)} placeholder="Search tools, pillars, or topics..." className="flex-1 border-0 bg-transparent text-base text-white outline-none placeholder:text-dk-dim"/>
              <button onClick={() => setSearchOpen(false)} className="rounded-md px-2 py-1 text-xs text-dk-muted hover:bg-dk-hover">Esc</button>
            </div>
            <div className="p-4 max-h-[50vh] overflow-y-auto">
              <p className="text-sm text-dk-muted mb-3">Tools</p>
              {TOOLS.filter(t => t.title.toLowerCase().includes(query.toLowerCase()) || t.description.toLowerCase().includes(query.toLowerCase())).map(tool => (
                <a key={tool.id} href={`/tools/${tool.slug}`} className="block p-3 rounded-lg hover:bg-dk-hover transition-colors">
                  <span className="text-sm font-semibold text-white">XFree {tool.title}</span>
                  <p className="text-xs text-dk-muted mt-1">{tool.description}</p>
                </a>
              ))}
              {query && TOOLS.filter(t => t.title.toLowerCase().includes(query.toLowerCase())).length === 0 && (
                <p className="text-sm text-dk-dim text-center py-4">No results found.</p>
              )}
            </div>
          </div>
        </div>
      )}

      <AuthModal isOpen={authModalOpen} onClose={() => setAuthModalOpen(false)} />
      <ProfileModal isOpen={profileOpen} onClose={() => setProfileOpen(false)} />
    </>
  );
}

function HomePage() {
  const { user, toggleFavorite, favorites } = useContext(AuthContext);

  return (
    <main id="main-content">
      {/* Hero */}
      <section className="relative overflow-hidden py-20 sm:py-28" aria-labelledby="hero-heading">
        <div className="absolute inset-0 pointer-events-none" aria-hidden="true">
          <div className="absolute top-20 left-1/4 w-96 h-96 bg-indigo-500/5 rounded-full blur-3xl"/>
          <div className="absolute bottom-20 right-1/4 w-80 h-80 bg-purple-500/5 rounded-full blur-3xl"/>
        </div>
        <div className="relative mx-auto max-w-5xl px-4 text-center sm:px-6">
          <div className="fade-up inline-flex items-center gap-2 rounded-full border border-indigo-500/20 bg-indigo-500/5 px-4 py-1.5 text-xs font-medium text-indigo-400 mb-8">
            <span className="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"/>
            {TOOLS.length} Published Tools · Local-First
          </div>
          <h1 id="hero-heading" className="fade-up text-4xl font-black tracking-tight text-white sm:text-5xl lg:text-6xl" style={{animationDelay:'.1s'}}>
            XFree: Free Developer, SEO<br/>&amp; <span className="bg-gradient-to-r from-indigo-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent">Data Tools</span>
          </h1>
          <p className="fade-up mx-auto mt-6 max-w-2xl text-lg text-dk-muted leading-relaxed" style={{animationDelay:'.2s'}}>
            Privacy-first browser tools across 60 discoverable pillar hubs. Local Mode is the default — your data stays in your browser. {user ? `Welcome back, ${user.name}!` : 'Create an account to save favorites.'}
          </p>
        </div>
      </section>

      {/* Pillar Explorer (Replaces old static grid) */}
      <PillarExplorer />

      {/* Featured Tools with Favorites */}
      <section className="py-16 px-4 border-t border-dk-border" aria-labelledby="featured-heading">
        <div className="mx-auto max-w-7xl">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h2 id="featured-heading" className="text-xl font-bold text-white">Featured XFree Tools</h2>
              <p className="text-sm text-dk-muted mt-1">Verified utilities available for immediate use.</p>
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            {TOOLS.map(tool => {
              const isFav = favorites.includes(tool.id);
              return (
                <div key={tool.id} className="group rounded-xl border border-dk-border bg-dk-card p-4 glow-border card-hover relative">
                  {user && (
                    <button 
                      onClick={() => toggleFavorite(tool.id)}
                      className="absolute top-4 right-4 p-1.5 rounded-full hover:bg-dk-hover transition-colors"
                      aria-label={isFav ? "Remove from favorites" : "Add to favorites"}
                    >
                      <svg className={`w-5 h-5 ${isFav ? 'text-amber-400 fill-amber-400' : 'text-dk-dim'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                    </button>
                  )}
                  <div className="flex items-start gap-3 mb-3 pr-8">
                    <div className="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-sm font-mono font-bold text-indigo-400 shrink-0">
                      {tool.title.charAt(0)}
                    </div>
                    <div>
                      <h3 className="text-sm font-semibold text-white group-hover:text-indigo-400 transition-colors">XFree {tool.title}</h3>
                      <p className="text-xs text-dk-muted leading-relaxed mt-1">{tool.description}</p>
                    </div>
                  </div>
                  <a href={`/tools/${tool.slug}`} className="inline-flex items-center text-xs text-indigo-400 hover:text-indigo-300 font-medium mt-2">
                    Open Tool <span className="ml-1">→</span>
                  </a>
                </div>
              );
            })}
          </div>
        </div>
      </section>
    </main>
  );
}

  return (
    <footer className="border-t border-dk-border bg-dk-bg">
      <div className="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
        <div className="flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-dk-dim">
          <p>© {new Date().getFullYear()} XFree. Open-source software released under the MIT License.</p>
          <div className="flex gap-4">
            <a href="/privacy" className="hover:text-indigo-400 transition-colors">Privacy</a>
            <a href="/terms" className="hover:text-indigo-400 transition-colors">Terms</a>
            <a href="/security" className="hover:text-indigo-400 transition-colors">Security</a>
          </div>
        </div>
      </div>
    </footer>
  );
}

function App() {
  return (
    <AuthProvider>
      <SiteHeader />
      <HomePage />
      <SiteFooter />
    </AuthProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
