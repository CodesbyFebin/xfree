name: Performance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers and serve dist
        run: |
          npx playwright install --with-deps chromium
          npm install -g serve

      - name: Serve dist directory
        run: serve -s dist -l 3000 &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/health.json

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/tools/json-formatter
            http://localhost:3000/pillar/seo-tools
            http://localhost:3000/guides
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: ./lighthouse-budget.json
