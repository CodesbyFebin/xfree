name: Improvement
description: Suggest an improvement to existing behavior, UX, performance, or code
title: "[improve]: "
labels: ["improvement"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - UX / UI
        - Performance
        - Accessibility
        - SEO / AEO / GEO
        - Security
        - Code quality / refactoring
        - Developer experience
    validations:
      required: true
